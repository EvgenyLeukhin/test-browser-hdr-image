<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>README preview</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.6.1/github-markdown.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
    />

    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Ubuntu,
          Cantarell,
          Noto Sans,
          sans-serif;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 56px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 16px;
      }
      .title {
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn {
        appearance: none;
        border: 1px solid color-mix(in oklab, CanvasText 18%, transparent);
        background: color-mix(in oklab, CanvasText 6%, transparent);
        color: CanvasText;
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
      }
      .btn:hover {
        background: color-mix(in oklab, CanvasText 10%, transparent);
      }
      .note {
        opacity: 0.8;
        font-size: 13px;
      }
      .error {
        white-space: pre-wrap;
        border: 1px solid color-mix(in oklab, CanvasText 18%, transparent);
        border-radius: 12px;
        padding: 12px;
      }
      .markdown-body {
        box-sizing: border-box;
        padding: 24px;
        border-radius: 14px;
        border: 1px solid color-mix(in oklab, CanvasText 12%, transparent);
        background: color-mix(in oklab, CanvasText 2%, transparent);
      }
      @media (max-width: 720px) {
        .markdown-body {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <div>
          <div class="title">README.md — preview</div>
          <div class="note">Источник: <code>/README.md</code> (из корня проекта)</div>
        </div>
        <div class="actions">
          <button class="btn" id="reloadBtn" type="button">Обновить</button>
          <a class="btn" href="./README.md">Открыть .md</a>
        </div>
      </div>

      <article id="content" class="markdown-body">Загрузка…</article>
    </div>

    <script type="module">
      import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15.0.12/+esm';
      import hljs from 'https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/+esm';

      const contentEl = document.querySelector('#content');
      const reloadBtn = document.querySelector('#reloadBtn');

      marked.setOptions({
        gfm: true,
        breaks: false,
        highlight(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        },
      });

      function resolveRelativeLinks() {
        for (const a of contentEl.querySelectorAll('a[href]')) {
          const href = a.getAttribute('href') ?? '';
          if (!href || href.startsWith('#') || /^[a-z]+:/i.test(href)) {
            continue;
          }
          a.setAttribute('href', new URL(href, new URL('./README.md', location.href)).href);
        }
        for (const img of contentEl.querySelectorAll('img[src]')) {
          const src = img.getAttribute('src') ?? '';
          if (!src || /^[a-z]+:/i.test(src)) {
            continue;
          }
          img.setAttribute('src', new URL(src, new URL('./README.md', location.href)).href);
        }
      }

      async function load() {
        try {
          contentEl.textContent = 'Загрузка…';
          const res = await fetch('./README.md', { cache: 'no-store' });
          if (!res.ok) {
            throw new Error(`Не удалось загрузить README.md (HTTP ${res.status})`);
          }
          const md = await res.text();
          contentEl.innerHTML = marked.parse(md);
          resolveRelativeLinks();
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          contentEl.classList.remove('markdown-body');
          contentEl.classList.add('error');
          contentEl.textContent =
            `Ошибка: ${msg}\n\n` +
            `Проверьте, что корневой README.md доступен по URL ./README.md.`;
        }
      }

      reloadBtn.addEventListener('click', load);
      await load();
    </script>
  </body>
</html>
